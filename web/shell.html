<!doctype html>
<!--
    The page around a BagiEngine game built with Emscripten (emcc --shell-file, set by cmake/BagiWeb.cmake). One self-contained file:
    no external fonts, scripts or CDN.

    - The canvas with the id "canvas" is the one SDL draws on (SDL_HINT_EMSCRIPTEN_CANVAS_SELECTOR defaults to "#canvas").
      It fills the browser window by CSS; the engine follows the window size and devicePixelRatio (SDLWebCanvas.cpp).
    - The page first asks the browser for a WebGL context. Without one it shows a message and never starts the game: the
      script that emcc substitutes for the SCRIPT placeholder (below) sits in a <template>, which the browser does not run, and
      only the test below starts it.
    - A threaded build (placeholder BAGI_WEB_THREADS below, set by cmake/BagiWeb.cmake when it copies this file next to the page)
      needs a cross-origin isolated page: its worker threads share the wasm memory through a SharedArrayBuffer. Without that the
      page shows a message and does not start the game, because a pthread wasm that finds no SharedArrayBuffer stops with a cryptic
      error. The single-thread build needs nothing and starts anyway.
    - Module.setStatus and Module.monitorRunDependencies feed the loading bar (the .data package and the wasm download);
      Module.onAbort, Module.onExit, the page's error event and an unhandled promise rejection (a .data package that did not
      download) show a message when the game stops.
    - Fullscreen: a small toggle button (top right) where document.fullscreenEnabled is true and the page is not already an installed
      app, and, on a touch screen, one request for fullscreen on the first tap (not with ?fullscreen=0). After it the page asks
      screen.orientation.lock for the orientation of manifest.webmanifest (written by tools/web/package.py from the game's web/app.json).
      iOS Safari has no fullscreen API for a page, so there the button stays hidden and the home-screen app (apple meta tags below,
      display: fullscreen of the manifest elsewhere) is the way. Every call can be refused: the page then starts and plays as before.

    Checked by tools/web/tests/test_shell.py (text only; check_bagi_web.cmake checks the copy CMake makes). Built with emsdk 4.0.23:
    emcc replaces the SCRIPT placeholder and, at -O2, minifies the page (the tag#id selectors survive). tools/web/tests/web_smoke.py
    runs the built page of BagiMatch3 in Chromium and Edge (tools/web/CLAUDE.md, "The browser smoke"); the two messages above and the
    loading bar were also looked at by hand with WebGL off, without the headers and on a throttled network.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#101114">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>BagiEngine</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101114;
            color: #d8dbe2;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Selectors are written tag#id, not #id: a line that starts with # can be taken for a preprocessor directive by emcc's shell
           handling in some versions. The canvas covers the whole window and nothing scrolls. 100dvh follows the visible height on a
           phone, whose address bar makes 100vh taller than the screen. */
        canvas#canvas {
            display: block;
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            border: 0;
            outline: none;
            background: #000;
            /* The game takes the touches: no scrolling, pinch zoom or text selection on the canvas */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @supports (height: 100dvh) {
            canvas#canvas {
                height: 100dvh;
            }
        }

        /* The fullscreen toggle: small and dim, above the canvas and the panels, off the notch by the safe area. The plain top and
           right come first for a browser that does not know env() */
        button#fullscreen-toggle {
            position: fixed;
            top: 8px;
            right: 8px;
            top: calc(8px + env(safe-area-inset-top, 0px));
            right: calc(8px + env(safe-area-inset-right, 0px));
            z-index: 10;
            width: 36px;
            height: 36px;
            box-sizing: border-box;
            padding: 6px;
            border: 0;
            border-radius: 8px;
            background: rgba(16, 17, 20, 0.55);
            color: #ffffff;
            opacity: 0.35;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        button#fullscreen-toggle[hidden] {
            display: none;
        }

        button#fullscreen-toggle:hover {
            opacity: 0.9;
        }

        button#fullscreen-toggle svg {
            display: block;
            width: 100%;
            height: 100%;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        button#fullscreen-toggle svg.leave,
        button#fullscreen-toggle.active svg.enter {
            display: none;
        }

        button#fullscreen-toggle.active svg.leave {
            display: block;
        }

        .panel {
            position: fixed;
            left: 0;
            top: 0;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #101114;
        }

        .panel[hidden] {
            display: none;
        }

        .panel h1 {
            margin: 0 0 16px;
            font-size: 1.4rem;
            font-weight: 600;
        }

        progress#loading-bar {
            width: min(420px, 80vw);
            height: 10px;
            border: 0;
            border-radius: 5px;
            overflow: hidden;
            background: #2a2d36;
            accent-color: #5aa0ff;
        }

        progress#loading-bar::-webkit-progress-bar {
            background: #2a2d36;
        }

        progress#loading-bar::-webkit-progress-value {
            background: #5aa0ff;
        }

        progress#loading-bar::-moz-progress-bar {
            background: #5aa0ff;
        }

        div#loading-status {
            margin-top: 12px;
            min-height: 1.4em;
            font-size: 0.9rem;
            color: #98a0b0;
        }

        div#message {
            max-width: 36rem;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        div#message-detail {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #98a0b0;
        }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="-1"></canvas>

    <div id="loading" class="panel" hidden>
        <h1>Loading</h1>
        <progress id="loading-bar" max="1"></progress>
        <div id="loading-status">Starting...</div>
    </div>

    <div id="error" class="panel" role="alert" hidden>
        <h1 id="error-title"></h1>
        <div id="message"></div>
        <div id="message-detail"></div>
    </div>

    <button id="fullscreen-toggle" type="button" tabindex="-1" aria-label="Enter fullscreen" hidden>
        <svg class="enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        <svg class="leave" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
    </button>

    <noscript>
        <div class="panel">
            <h1>JavaScript is off</h1>
            <div>This game needs JavaScript. Turn it on for this page and reload.</div>
        </div>
    </noscript>

    <template id="module-script">{{{ SCRIPT }}}</template>

    <!--
        window.bagiWebPost: how the game sends a text body (a piece of a match log) to its own server. It has a script of its own,
        before the one below, so it exists whatever the WebGL test says, and it runs on the main thread (the game calls it from
        there: a Worker has no window). start(path, body, contentType) returns a positive id, or 0 when it refuses; poll(id) returns -1
        while the answer is pending, 0 for a network failure or an unknown id, otherwise the HTTP status (and forgets the id). The game
        polls instead of being called back, so no C function has to be exported. The path is a path of this origin and the page's Basic
        credentials ride along. keepalive lets a post outlive a closing tab, but Chromium refuses a keepalive body above 64 KiB, so it
        is used up to 60000 bytes only. The rules for the path and the size are the same as in CoreSDL/SDLWebPost.cpp. The script knows
        no game and logs neither paths nor bodies.
    -->
    <script id="bagi-web-post">
        (function () {
            "use strict";

            var kMaxBodyBytes = 1048576;
            var kMaxPathBytes = 2048;
            var kMaxInFlight = 64;
            var kKeepaliveMaxBytes = 60000;
            var kExpireMs = 60000;  // an id that nobody polled for this long is dropped, so a lost game cannot leak
            var kDefaultContentType = "application/x-ndjson";
            var kFirstPrintable = 0x21;
            var kLastPrintable = 0x7e;
            var kBackslash = 0x5c;

            var entries = Object.create(null);  // id -> {status: -1 while pending, touched: ms}
            var inFlight = 0;
            var nextId = 1;

            // A path of this origin: one leading "/", not "//", printable ASCII only (no space, control character or non-ASCII,
            // which also makes the length the byte count), no backslash, no ".."
            function isPathValid(path) {
                if (typeof path !== "string" || path.length === 0 || path.length > kMaxPathBytes) {
                    return false;
                }
                if (path.charAt(0) !== "/" || path.charAt(1) === "/" || path.indexOf("..") !== -1) {
                    return false;
                }
                for (var i = 0; i < path.length; ++i) {
                    var code = path.charCodeAt(i);
                    if (code < kFirstPrintable || code > kLastPrintable || code === kBackslash) {
                        return false;
                    }
                }
                return true;
            }

            function forget(id) {
                var entry = entries[id];
                if (entry) {
                    if (entry.status === -1) {
                        --inFlight;
                    }
                    delete entries[id];
                }
            }

            function dropExpired(time) {
                for (var id in entries) {
                    if (time - entries[id].touched > kExpireMs) {
                        forget(id);
                    }
                }
            }

            function start(path, body, contentType) {
                try {
                    if (!isPathValid(path) || typeof body !== "string" || body.length > kMaxBodyBytes) {
                        return 0;
                    }
                    var bytes = new TextEncoder().encode(body).length;
                    if (bytes > kMaxBodyBytes) {
                        return 0;
                    }
                    var time = Date.now();
                    dropExpired(time);
                    if (inFlight >= kMaxInFlight) {
                        return 0;
                    }
                    var id = nextId++;
                    var entry = {status: -1, touched: time};
                    entries[id] = entry;
                    ++inFlight;
                    var finish = function (status) {
                        if (entries[id] === entry && entry.status === -1) {
                            entry.status = status;
                            --inFlight;
                        }
                    };
                    try {
                        fetch(path, {
                            method: "POST",
                            body: body,
                            headers: {"Content-Type": typeof contentType === "string" && contentType !== "" ? contentType : kDefaultContentType},
                            credentials: "same-origin",
                            cache: "no-store",
                            keepalive: bytes <= kKeepaliveMaxBytes
                        }).then(function (response) {
                            finish(response.status);
                        }, function () {
                            finish(0);
                        });
                    } catch (error) {
                        forget(id);
                        return 0;
                    }
                    return id;
                } catch (error) {
                    return 0;
                }
            }

            function poll(id) {
                var entry = entries[id];
                if (!entry) {
                    return 0;
                }
                entry.touched = Date.now();
                if (entry.status === -1) {
                    return -1;
                }
                var status = entry.status;
                forget(id);
                return status;
            }

            window.bagiWebPost = {start: start, poll: poll};
        })();
    </script>

    <script>
        (function () {
            "use strict";

            var canvas = document.getElementById("canvas");
            var loadingPanel = document.getElementById("loading");
            var loadingBar = document.getElementById("loading-bar");
            var loadingStatus = document.getElementById("loading-status");
            var errorPanel = document.getElementById("error");
            var errorTitle = document.getElementById("error-title");
            var errorMessage = document.getElementById("message");
            var errorDetail = document.getElementById("message-detail");

            var failed = false;
            var running = false;  // the runtime is up (setStatus said so): from then on the loading panel has nothing left to report

            // The two panels never show at once. Only textContent is used: a message from the game is not HTML.
            function showError(title, message, detail) {
                if (failed) {
                    return;  // the first failure is the cause, the rest follow from it
                }
                failed = true;
                loadingPanel.hidden = true;
                errorTitle.textContent = title;
                errorMessage.textContent = message;
                errorDetail.textContent = detail || "";
                errorPanel.hidden = false;
            }

            function setLoadingText(text) {
                loadingStatus.textContent = text;
            }

            // fraction 0..1, or null for a bar that only moves back and forth (a progress element without a value)
            function setProgress(fraction) {
                if (fraction === null) {
                    loadingBar.removeAttribute("value");
                } else {
                    loadingBar.value = Math.max(0, Math.min(1, fraction));
                }
            }

            function hideLoading() {
                loadingPanel.hidden = true;
            }

            function megabytes(bytes) {
                return (bytes / (1024 * 1024)).toFixed(1);
            }

            // The WebGL test: a context of either version on a scratch canvas. The game's own canvas is left alone, because a
            // canvas keeps the first kind of context it was asked for. The scratch context is lost on purpose at once: a phone has
            // few contexts and little GPU memory, and a live one would sit beside the game's for the life of the page.
            function hasWebGL() {
                try {
                    var scratch = document.createElement("canvas");
                    var gl = scratch.getContext("webgl2") || scratch.getContext("webgl");
                    if (!gl) {
                        return false;
                    }
                    var lose = gl.getExtension("WEBGL_lose_context");
                    if (lose) {
                        lose.loseContext();
                    }
                    return true;
                } catch (error) {
                    return false;
                }
            }

            // Right after a reload a phone's browser may still hold the contexts of the page it unloaded and refuse a new one, so a
            // failed test reloads the page itself, at most kWebGLReloads times per tab (sessionStorage, which may be missing or throw).
            var kWebGLReloads = 2;
            var kWebGLReloadDelayMs = 1000;
            var webglReloadKey = "bagi.webglReloads";
            function webglReloads() {
                try {
                    return parseInt(window.sessionStorage.getItem(webglReloadKey) || "0", 10) || 0;
                } catch (error) {
                    return kWebGLReloads;
                }
            }
            function setWebGLReloads(count) {
                try {
                    if (count > 0) {
                        window.sessionStorage.setItem(webglReloadKey, String(count));
                    } else {
                        window.sessionStorage.removeItem(webglReloadKey);
                    }
                } catch (error) {
                    // no storage: no reload either (webglReloads says the budget is spent)
                }
            }

            if (!hasWebGL()) {
                var reloads = webglReloads();
                if (reloads < kWebGLReloads) {
                    setWebGLReloads(reloads + 1);
                    loadingPanel.hidden = false;
                    setLoadingText("Waiting for the graphics ...");
                    console.warn("No WebGL context yet; reloading the page (" + (reloads + 1) + " of " + kWebGLReloads + ")");
                    window.setTimeout(function () {
                        window.location.reload();
                    }, kWebGLReloadDelayMs);
                    return;
                }
                setWebGLReloads(0);
                showError(
                    "WebGL is not available",
                    "This game draws with WebGL, and this browser did not give it a WebGL context. If the game ran here before, the browser may have turned WebGL off for this site after a graphics error: close every tab of the game, or restart the browser, and open it again. Otherwise try another browser, turn on hardware acceleration in its settings, or update the browser or its graphics driver.");
                return;
            }
            setWebGLReloads(0);

            // 1 in a threaded build, 0 in a single-thread one: CMake writes the number in place of the placeholder in the copy of this
            // file that emcc takes as the shell. The text itself stays a string, so this file is valid JavaScript before the copy
            var threaded = "@BAGI_WEB_THREADS@" === "1";

            // A page is cross-origin isolated when it came with Cross-Origin-Opener-Policy: same-origin and
            // Cross-Origin-Embedder-Policy: require-corp, and only a secure context (https, or http on localhost) can be. Browsers
            // that do not know the property say undefined, which counts as not isolated.
            if (threaded && (window.crossOriginIsolated !== true || typeof SharedArrayBuffer === "undefined")) {
                var secure = window.isSecureContext !== false;
                showError(
                    "This page needs cross-origin isolation",
                    "This game runs its work on worker threads, which need the page to be cross-origin isolated: the server has to send " +
                    "the headers Cross-Origin-Opener-Policy: same-origin and Cross-Origin-Embedder-Policy: require-corp with the page. " +
                    "This page did not get them, so it does not start. Serve it with tools/web/serve.py, or set those two headers on your server.",
                    secure ? "" : "The page is not a secure context either: over plain HTTP only the host name localhost counts, so open the page by the name localhost, or serve it over HTTPS.");
                return;
            }

            var downloadSeen = false;
            var totalIsEncoded = false;
            var totalDependencies = 0;

            // The object emcc's runtime reads (the hooks are those of the default shell of emsdk 4.x)
            window.Module = {
                canvas: canvas,

                // The game's log goes to the browser console: stdout as log, stderr as error
                print: function () {
                    console.log(Array.prototype.slice.call(arguments).join(" "));
                },
                printErr: function () {
                    console.error(Array.prototype.slice.call(arguments).join(" "));
                },

                // Called with texts such as "Downloading data... (1048576/5242880)", "Running..." and, when the runtime is up, ""
                setStatus: function (text) {
                    if (failed) {
                        return;
                    }
                    if (!text) {
                        running = true;
                        hideLoading();
                        return;
                    }
                    var match = /^(.*?)\s*\((\d+(?:\.\d+)?)\/(\d+)\)\s*$/.exec(text);
                    if (match) {
                        var done = parseFloat(match[2]);
                        var total = parseFloat(match[3]);
                        downloadSeen = true;
                        // emcc divides the bytes it has decoded by the Content-Length, which is the size of the compressed file when
                        // the server sends name.br / name.gz: the count then passes the total. Such a total says nothing, so once it
                        // has been passed the bar only moves back and forth and the text shows the bytes alone.
                        if (total <= 0 || done > total) {
                            totalIsEncoded = true;
                        }
                        if (totalIsEncoded) {
                            setProgress(null);
                            setLoadingText(match[1] + " " + megabytes(done) + " MB");
                        } else {
                            setProgress(done / total);
                            setLoadingText(match[1] + " " + megabytes(done) + " / " + megabytes(total) + " MB");
                        }
                    } else {
                        setLoadingText(text);
                    }
                },

                // The count of what the runtime still waits for (the package, the wasm). Moves the bar while the download has no byte counts.
                monitorRunDependencies: function (left) {
                    totalDependencies = Math.max(totalDependencies, left);
                    if (!downloadSeen && totalDependencies > 0) {
                        setProgress((totalDependencies - left) / totalDependencies);
                    }
                },

                // The runtime has exited: the game ended by itself (the Quit button), the loop is gone and the canvas is blank. emcc 4.0.23
                // calls this with no status in that case (seen in Chromium); a number other than 0 is a failed exit
                onExit: function (status) {
                    var failedExit = typeof status === "number" && status !== 0;
                    console.log("The game ended" + (failedExit ? " (exit status " + status + ")" : ""));
                    showError(failedExit ? "The game stopped" : "The game has ended", "Reload the page to start again.",
                              failedExit ? "Exit status " + status : "");
                },

                // The module aborted: a failed assertion of the runtime, a trap of the wasm, a wasm or package that did not download
                onAbort: function (what) {
                    var text = what === undefined || what === null ? "" : String(what);
                    console.error("The game aborted: " + text);
                    showError("The game stopped", "It cannot go on. Reload the page to start again.", text);
                }
            };

            // A lost WebGL context cannot be brought back by the game
            canvas.addEventListener("webglcontextlost", function (event) {
                event.preventDefault();
                showError("The graphics context was lost", "Reload the page to start again.");
            }, false);

            canvas.addEventListener("contextmenu", function (event) {
                event.preventDefault();
            }, false);

            // Anything the page did not catch itself, such as a script or a package that did not load
            window.addEventListener("error", function (event) {
                var text = event && event.message ? String(event.message) : "";
                if (text.indexOf("ResizeObserver") !== -1) {
                    return;  // browsers report this one for harmless layout loops
                }
                showError("The game hit an error", "See the browser console for details. Reload the page to start again.", text);
            });

            // A promise nobody awaited that failed: emcc's loader of the .data package is one, so a package that did not download
            // (a 404, a lost connection) ends here and not in the handler above. Once the game runs a rejected promise of its own
            // is only logged: "could not be loaded" over a running game would be wrong
            window.addEventListener("unhandledrejection", function (event) {
                var reason = event && event.reason;
                var text = reason && reason.message ? String(reason.message) : String(reason);
                if (running) {
                    console.error("Unhandled promise rejection: " + text);
                    return;
                }
                showError("The game could not be loaded", "Part of the game did not download or start. Check the connection and reload the page.", text);
            });

            // The fullscreen toggle, the request on the first tap and the orientation lock. Everything here may be refused or missing
            // (iOS Safari has no document.fullscreenEnabled, a browser may reject the request): then the page stays as it is. Every
            // promise has a rejection handler, or the handler of "unhandledrejection" below would call it a failed start.
            function matches(query) {
                try {
                    return !!(window.matchMedia && window.matchMedia(query).matches);
                } catch (error) {
                    return false;
                }
            }

            function setUpFullscreen() {
                var toggle = document.getElementById("fullscreen-toggle");
                var root = document.documentElement;
                var requestFn = root.requestFullscreen || root.webkitRequestFullscreen;
                var exitFn = document.exitFullscreen || document.webkitExitFullscreen;
                var enabled = (document.fullscreenEnabled === true || document.webkitFullscreenEnabled === true) && !!requestFn && !!exitFn;
                // An installed app or a page the browser already shows without bars (read now: the display mode "fullscreen" also
                // matches once this page has made itself fullscreen)
                var installed = window.navigator.standalone === true || matches("(display-mode: standalone)") || matches("(display-mode: fullscreen)");
                if (!toggle || !enabled || installed) {
                    return;
                }

                var orientation = "any";
                var manifestRead = Promise.resolve();
                if (typeof fetch === "function") {
                    manifestRead = fetch("manifest.webmanifest").then(function (response) {
                        return response.ok ? response.json() : null;
                    }).then(function (manifest) {
                        if (manifest && typeof manifest.orientation === "string") {
                            orientation = manifest.orientation;
                        }
                    }).catch(function () {});
                }

                function fullscreenElement() {
                    return document.fullscreenElement || document.webkitFullscreenElement || null;
                }

                function logRefusal(error) {
                    console.warn("Fullscreen was refused: " + (error && error.message ? error.message : String(error)));
                }

                function enterFullscreen() {
                    try {
                        var result = requestFn.call(root, { navigationUI: "hide" });
                        if (result && typeof result.then === "function") {
                            result.then(function () {}, logRefusal);
                        }
                    } catch (error) {
                        logRefusal(error);
                    }
                }

                function leaveFullscreen() {
                    try {
                        var result = exitFn.call(document);
                        if (result && typeof result.then === "function") {
                            result.then(function () {}, logRefusal);
                        }
                    } catch (error) {
                        logRefusal(error);
                    }
                }

                function lockOrientation() {
                    manifestRead.then(function () {
                        var screenOrientation = window.screen && window.screen.orientation;
                        if (orientation === "any" || !screenOrientation || typeof screenOrientation.lock !== "function") {
                            return;
                        }
                        var result = screenOrientation.lock(orientation);
                        if (result && typeof result.catch === "function") {
                            result.catch(function () {});
                        }
                    }).catch(function () {});
                }

                function unlockOrientation() {
                    try {
                        window.screen.orientation.unlock();
                    } catch (error) {
                        // no lock to release, or no API
                    }
                }

                function showState(active) {
                    toggle.classList.toggle("active", active);
                    toggle.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
                }

                function onFullscreenChange() {
                    var active = fullscreenElement() !== null;
                    showState(active);
                    if (active) {
                        lockOrientation();
                    } else {
                        unlockOrientation();
                    }
                }

                document.addEventListener("fullscreenchange", onFullscreenChange);
                document.addEventListener("webkitfullscreenchange", onFullscreenChange);

                // The first tap of a touch screen asks once; a user who leaves fullscreen is not asked again. ?fullscreen=0 turns it off
                function stopAskingOnTap() {
                    window.removeEventListener("pointerup", onFirstTap, true);
                }

                function onFirstTap(event) {
                    if (event.pointerType !== "touch" || toggle.contains(event.target)) {
                        return;
                    }
                    stopAskingOnTap();
                    if (fullscreenElement() === null) {
                        enterFullscreen();
                    }
                }

                if (!/[?&]fullscreen=0(&|$)/.test(window.location.search) && matches("(pointer: coarse)")) {
                    window.addEventListener("pointerup", onFirstTap, true);
                }

                toggle.addEventListener("click", function () {
                    stopAskingOnTap();
                    if (fullscreenElement() === null) {
                        enterFullscreen();
                    } else {
                        leaveFullscreen();
                    }
                    toggle.blur();
                });
                // The button takes its touches and clicks itself: the game listens on the canvas and the document, and must not see them
                ["pointerdown", "pointerup", "mousedown", "mouseup", "touchstart", "touchend", "touchmove"].forEach(function (name) {
                    toggle.addEventListener(name, function (event) {
                        event.stopPropagation();
                    });
                });

                toggle.hidden = false;
                showState(fullscreenElement() !== null);
            }

            try {
                setUpFullscreen();
            } catch (error) {
                console.warn("The fullscreen button was not set up: " + error);
            }

            loadingPanel.hidden = false;
            setProgress(null);

            // Start the game (the page has a WebGL context): run the script that emcc put into the template
            var template = document.getElementById("module-script");
            var original = template.content.querySelector("script");
            var script = document.createElement("script");
            if (original && original.getAttribute("src")) {
                script.src = original.getAttribute("src");
            } else if (original) {
                script.textContent = original.textContent;
            }
            script.async = true;
            script.onerror = function () {
                showError("The game could not be loaded", "The game code did not download. Check the connection and reload the page.", script.src);
            };
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
